<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- Dark background -->
  <rect width="512" height="512" fill="#1a1a2e"/>

  <!-- Vitruvian circle - centered on navel -->
  <circle cx="256" cy="280" r="175" fill="none" stroke="#3a4a6a" stroke-width="2" opacity="0.5"/>

  <!-- Vitruvian square - figure fits inside -->
  <rect x="81" y="70" width="350" height="400" fill="none" stroke="#3a4a6a" stroke-width="2" opacity="0.35"/>

  <!-- Figure - anatomical proportions (8 heads tall) -->
  <!-- Head height ~50, total height ~400 -->

  <!-- Head (circle) -->
  <circle cx="256" cy="105" r="25" fill="none" stroke="#6a8caf" stroke-width="3"/>

  <!-- Neck -->
  <line x1="256" y1="130" x2="256" y2="150" stroke="#6a8caf" stroke-width="3" stroke-linecap="round"/>

  <!-- Torso -->
  <line x1="256" y1="150" x2="256" y2="280" stroke="#6a8caf" stroke-width="4" stroke-linecap="round"/>

  <!-- Arms extended (T-pose) - upper arms -->
  <line x1="256" y1="160" x2="185" y2="160" stroke="#6a8caf" stroke-width="3" stroke-linecap="round"/>
  <line x1="256" y1="160" x2="327" y2="160" stroke="#6a8caf" stroke-width="3" stroke-linecap="round"/>
  <!-- Forearms -->
  <line x1="185" y1="160" x2="115" y2="160" stroke="#6a8caf" stroke-width="3" stroke-linecap="round"/>
  <line x1="327" y1="160" x2="397" y2="160" stroke="#6a8caf" stroke-width="3" stroke-linecap="round"/>
  <!-- Hands -->
  <line x1="115" y1="160" x2="85" y2="160" stroke="#6a8caf" stroke-width="2" stroke-linecap="round"/>
  <line x1="397" y1="160" x2="427" y2="160" stroke="#6a8caf" stroke-width="2" stroke-linecap="round"/>

  <!-- Legs (standing) - thighs -->
  <line x1="256" y1="280" x2="220" y2="370" stroke="#6a8caf" stroke-width="4" stroke-linecap="round"/>
  <line x1="256" y1="280" x2="292" y2="370" stroke="#6a8caf" stroke-width="4" stroke-linecap="round"/>
  <!-- Calves -->
  <line x1="220" y1="370" x2="205" y2="460" stroke="#6a8caf" stroke-width="3" stroke-linecap="round"/>
  <line x1="292" y1="370" x2="307" y2="460" stroke="#6a8caf" stroke-width="3" stroke-linecap="round"/>

  <!-- Arms raised (diagonal - vitruvian) - ghosted -->
  <line x1="256" y1="160" x2="175" y2="90" stroke="#6a8caf" stroke-width="2" stroke-linecap="round" opacity="0.35"/>
  <line x1="256" y1="160" x2="337" y2="90" stroke="#6a8caf" stroke-width="2" stroke-linecap="round" opacity="0.35"/>
  <line x1="175" y1="90" x2="110" y2="55" stroke="#6a8caf" stroke-width="2" stroke-linecap="round" opacity="0.35"/>
  <line x1="337" y1="90" x2="402" y2="55" stroke="#6a8caf" stroke-width="2" stroke-linecap="round" opacity="0.35"/>

  <!-- Legs spread (vitruvian) - ghosted -->
  <line x1="256" y1="280" x2="165" y2="380" stroke="#6a8caf" stroke-width="3" stroke-linecap="round" opacity="0.35"/>
  <line x1="256" y1="280" x2="347" y2="380" stroke="#6a8caf" stroke-width="3" stroke-linecap="round" opacity="0.35"/>
  <line x1="165" y1="380" x2="100" y2="455" stroke="#6a8caf" stroke-width="2" stroke-linecap="round" opacity="0.35"/>
  <line x1="347" y1="380" x2="412" y2="455" stroke="#6a8caf" stroke-width="2" stroke-linecap="round" opacity="0.35"/>

  <!-- Motion capture markers - main pose -->
  <!-- Head -->
  <circle cx="256" cy="80" r="7" fill="#e94560"/>

  <!-- Neck -->
  <circle cx="256" cy="140" r="5" fill="#f5a623"/>

  <!-- Shoulders -->
  <circle cx="185" cy="160" r="6" fill="#16c79a"/>
  <circle cx="327" cy="160" r="6" fill="#16c79a"/>

  <!-- Elbows -->
  <circle cx="115" cy="160" r="5" fill="#f5a623"/>
  <circle cx="397" cy="160" r="5" fill="#f5a623"/>

  <!-- Wrists -->
  <circle cx="85" cy="160" r="4" fill="#e94560"/>
  <circle cx="427" cy="160" r="4" fill="#e94560"/>

  <!-- Chest -->
  <circle cx="256" cy="200" r="5" fill="#e94560"/>

  <!-- Navel/Pelvis -->
  <circle cx="256" cy="280" r="6" fill="#16c79a"/>

  <!-- Hips -->
  <circle cx="235" cy="285" r="4" fill="#0f3460"/>
  <circle cx="277" cy="285" r="4" fill="#0f3460"/>

  <!-- Knees -->
  <circle cx="220" cy="370" r="5" fill="#f5a623"/>
  <circle cx="292" cy="370" r="5" fill="#f5a623"/>

  <!-- Ankles -->
  <circle cx="205" cy="460" r="4" fill="#16c79a"/>
  <circle cx="307" cy="460" r="4" fill="#16c79a"/>

  <!-- Secondary pose markers (ghosted) -->
  <!-- Raised arm elbows -->
  <circle cx="175" cy="90" r="4" fill="#f5a623" opacity="0.4"/>
  <circle cx="337" cy="90" r="4" fill="#f5a623" opacity="0.4"/>
  <!-- Raised arm wrists -->
  <circle cx="110" cy="55" r="3" fill="#e94560" opacity="0.4"/>
  <circle cx="402" cy="55" r="3" fill="#e94560" opacity="0.4"/>

  <!-- Spread leg knees -->
  <circle cx="165" cy="380" r="4" fill="#f5a623" opacity="0.4"/>
  <circle cx="347" cy="380" r="4" fill="#f5a623" opacity="0.4"/>
  <!-- Spread leg ankles -->
  <circle cx="100" cy="455" r="3" fill="#16c79a" opacity="0.4"/>
  <circle cx="412" cy="455" r="3" fill="#16c79a" opacity="0.4"/>

  <!-- Camera corner brackets -->
  <g stroke="#e94560" stroke-width="2" opacity="0.4">
    <path d="M25,45 L25,25 L45,25" fill="none"/>
    <path d="M467,25 L487,25 L487,45" fill="none"/>
    <path d="M25,467 L25,487 L45,487" fill="none"/>
    <path d="M467,487 L487,487 L487,467" fill="none"/>
  </g>
</svg>
