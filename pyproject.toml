[project]
name = "calimerge"
version = "0.2.1"
description = "Unified multi-camera motion capture with synchronized recording"
license = "BSD-2-Clause"
authors = [
    { name = "Mac Prible", email = "prible@gmail.com" }
]
requires-python = ">=3.10,<3.13"
dependencies = [
    "numpy>=1.24.0",
    "opencv-contrib-python>=4.8.0",
    "PySide6>=6.6.0",
    "numba>=0.59.0",
    "scipy>=1.11.0",
    "rtoml>=0.10.0",
    "huggingface-hub>=0.20.0",
    "pandas>=2.0.0",
    "onnxscript>=0.6.2",
    "matplotlib>=3.7.0",
    "pyqtgraph>=0.13.0",
    "mediapipe>=0.10.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-qt>=4.2.0",
    "ruff>=0.1.0",
]
pytorch-backend = [
    "torch>=2.0.0",
    "torchvision>=0.15.0",
    "transformers>=4.36.0",
    "ultralytics>=8.0.0",
    "Pillow>=9.0.0",
]

[project.scripts]
calimerge = "calimerge.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/calimerge"]

[[tool.uv.index]]
name = "pypi"
url = "https://pypi.org/simple"

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.uv.sources]
# Use CUDA wheels on Windows/Linux, standard PyPI wheels on macOS
torch = [
    { index = "pytorch-cu128", marker = "sys_platform != 'darwin'" },
    { index = "pypi", marker = "sys_platform == 'darwin'" },
]
torchvision = [
    { index = "pytorch-cu128", marker = "sys_platform != 'darwin'" },
    { index = "pypi", marker = "sys_platform == 'darwin'" },
]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
